[package]
name = "seqarc"
version = "0.1.0"
edition = "2021"
description = "Rust archiver for sequencing reads with fast, alignment-based compression"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
crossbeam-channel = "0.5"
bed-utils = "0.11"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
flate2 = "1"
indicatif = "0.17"
mimalloc = "0.1"
libc = "0.2"
libm = "0.2"
libsais-rs = "0.2.2"
memmap2 = "0.9"
noodles = { version = "0.113", features = ["sam"] }
rayon = "1"
rkyv = { version = "0.8", features = ["bytecheck"] }
rustar-aligner = { git = "https://github.com/scverse/rustar-aligner", rev = "207773b11df5fb9c229bbbcf5385f6daa7f2fe7c" }
tempfile = "3"
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
