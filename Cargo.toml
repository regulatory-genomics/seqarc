[package]
name = "spring-rs"
version = "0.1.0"
edition = "2021"
description = "Rust-native library for compressing sequencing reads"
license = "MIT"

[dependencies]
crossbeam-channel = "0.5"
bed-utils = "0.11"
flate2 = "1"
rkyv = { version = "0.8", features = ["bytecheck"] }
zstd = { version = "0.13", features = ["zstdmt"] }

[dev-dependencies]
criterion = "0.8"
tempfile = "3"

[[bench]]
name = "compression"
harness = false
