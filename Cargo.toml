[package]
name = "spring-rs"
version = "0.1.0"
edition = "2021"
description = "Rust-native library for compressing sequencing reads"
license = "MIT"

[dependencies]
crossbeam-channel = "0.5"
bed-utils = "0.11"
flate2 = "1"
indicatif = "0.17"
minibwa = { git = "https://github.com/regulatory-genomics/minibwa-rs" }
rayon = "1"
rkyv = { version = "0.8", features = ["bytecheck"] }
tempfile = "3"
zstd = "0.13"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "compression"
harness = false
