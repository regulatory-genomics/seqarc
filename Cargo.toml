[package]
name = "seqarc"
version = "0.1.0"
edition = "2021"
description = "Rust-native library for archiving compressed sequencing reads"
license = "MIT"

[dependencies]
crossbeam-channel = "0.5"
bed-utils = "0.11"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
indicatif = "0.17"
minibwa-rs = { git = "https://github.com/henriksson-lab/minibwa-rs" }
rayon = "1"
rkyv = { version = "0.8", features = ["bytecheck"] }
tempfile = "3"
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2"
criterion = "0.8"
predicates = "3"

[[bench]]
name = "compression"
harness = false
